<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz History</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; }
        .quiz-item { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .quiz-item h3 { margin: 0 0 10px; }
        .quiz-meta { color: #666; font-size: 0.9em; }
        .score { font-size: 1.5em; font-weight: bold; color: #4CAF50; }
        .score.low { color: #f44336; }
        .no-quizzes { color: #888; padding: 40px; text-align: center; }
    </style>
</head>
<body>
    <h1>📝 Quiz History</h1>

    {% if quizzes %}
        {% for quiz in quizzes %}
        <div class="quiz-item">
            <h3>Week of {{ quiz.week_start_date }}</h3>
            <div class="quiz-meta">
                {{ quiz.questions.count }} questions •
                Created {{ quiz.created_at|date:"M d, Y" }}
            </div>
            <p><a href="/quiz/results/{{ quiz.id }}/">View results →</a></p>
        </div>
        {% endfor %}
    {% else %}
        <div class="no-quizzes">
            <p>No quizzes yet.</p>
            <p><a href="/quiz/take/">Take your first quiz →</a></p>
        </div>
    {% endif %}

    <p><a href="/">← Back to Dashboard</a></p>
</body>
</html>
