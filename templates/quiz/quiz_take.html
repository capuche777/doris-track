<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; }
        .question { background: #f9f9f9; padding: 20px; margin: 20px 0; border-radius: 8px; border-left: 4px solid #4CAF50; }
        .question p { font-size: 1.1em; }
        .question-type { font-size: 0.85em; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 1em; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; padding: 12px 30px; border: none; border-radius: 6px; font-size: 1em; cursor: pointer; }
        button:hover { background: #45a049; }
        .progress { color: #888; font-size: 0.9em; margin-bottom: 20px; }
        .feedback { padding: 10px; margin: 10px 0; border-radius: 6px; }
        .feedback.correct { background: #d4edda; color: #155724; }
        .feedback.incorrect { background: #f8d7da; color: #721c24; }
        .next-btn { background: #2196F3; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>📝 Weekly Quiz</h1>
    <p class="progress">Week of {{ quiz.week_start_date }} — Question {{ forloop.counter }} of {{ questions.count }}</p>

    <div id="questions-container">
        {% for question in questions %}
        <div class="question" id="question-{{ question.id }}" data-question-id="{{ question.id }}">
            <div class="question-type">{{ question.get_question_type_display }}</div>
            <p><strong>{{ question.prompt }}</strong></p>
            <form method="POST" action="{% url 'quiz:quiz_submit' question.id %}" class="quiz-form">
                {% csrf_token %}
                <input type="text" name="answer" placeholder="Your answer..." required>
                <button type="submit">Submit</button>
            </form>
            <div class="feedback" id="feedback-{{ question.id }}" style="display:none;"></div>
            <a href="{% url 'quiz:quiz_results' quiz.id %}" class="next-btn" id="results-link-{{ question.id }}" style="display:none;">View Results →</a>
        </div>
        {% endfor %}
    </div>

    <p><a href="{% url 'quiz:quiz_list' %}">← Back to quiz list</a></p>

    <script>
    document.querySelectorAll('.quiz-form').forEach(function(form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const questionDiv = form.closest('.question');
            const questionId = questionDiv.dataset.questionId;
            const feedbackDiv = document.getElementById('feedback-' + questionId);
            const resultsLink = document.getElementById('results-link-' + questionId);
            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                }
            })
            .then(response => response.text())
            .then(data => {
                feedbackDiv.innerHTML = data;
                feedbackDiv.style.display = 'block';
                feedbackDiv.className = 'feedback ' + (data.includes('✓') ? 'correct' : 'incorrect');
                form.style.display = 'none';
                resultsLink.style.display = 'inline-block';
            })
            .catch(err => {
                feedbackDiv.innerHTML = 'Error submitting answer.';
                feedbackDiv.style.display = 'block';
            });
        });
    });
    </script>
</body>
</html>
