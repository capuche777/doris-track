# DorisTrack with SQLite (no external DB needed)
# For development: just run `python django/manage.py runserver`
# For production with PostgreSQL:
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=change-me-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      # Mount the whole repo at /app so code lives at /app/django (matches
      # the image's WORKDIR /app/django and the four-parent BASE_DIR). This
      # also exposes repo-root templates/ and static/ at /app/templates and
      # /app/static.
      - .:/app
    restart: unless-stopped