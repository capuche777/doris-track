# DorisTrack with SQLite (no external DB needed)
# For development: just run `python django/manage.py runserver`
# For production with PostgreSQL:
services:
  web:
    build:
      context: .
      dockerfile: Python/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=change-me-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1
      # Default settings module for both gunicorn and manage.py. dev pulls in
      # debug_toolbar/django_extensions (declared in requirements-dev.txt) and
      # forces DEBUG=True, overriding the DEBUG/SECRET_KEY/ALLOWED_HOSTS above.
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    volumes:
      # Only the Django project lives in the container, mounted at /app (matches
      # the image layout and BASE_DIR=/app). templates/, static/, db.sqlite3 and
      # pytest.ini all live under django/.
      - ./django:/app
    restart: unless-stopped