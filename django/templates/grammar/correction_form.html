{% extends "base.html" %}

{% block title %}Add Grammar Correction — DorisTrack{% endblock %}

{% block content %}
<div class="page-head">
  <div class="page-head__titles">
    <h1>Log Grammar Correction</h1>
    <p class="page-subtitle">Record a mistake and its correct form</p>
  </div>
  <div class="page-actions">
    <a href="{% url 'grammar:correction_list' %}" class="btn btn-ghost">Back to log</a>
  </div>
</div>

<div class="card">
  <form method="post" class="form">
    {% csrf_token %}
    <div class="field">
      <label>Student mistake *</label>
      <input type="text" name="student_mistake" required placeholder="e.g. I go yesterday">
    </div>
    <div class="field">
      <label>Correct version *</label>
      <input type="text" name="correct_version" required placeholder="e.g. I went yesterday">
    </div>
    <div class="field">
      <label>Category</label>
      <select name="category">
        <option value="prepositions">Prepositions</option>
        <option value="verb_tenses">Verb Tenses</option>
        <option value="word_order">Word Order</option>
        <option value="articles">Articles</option>
        <option value="other" selected>Other</option>
      </select>
    </div>
    <div class="field">
      <label>Grammar rule</label>
      <input type="text" name="grammar_rule" placeholder="e.g. Past simple of regular verbs">
    </div>
    <div class="cluster">
      <button type="submit" class="btn btn-primary">Log Correction</button>
      <a href="{% url 'grammar:correction_list' %}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
